<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>L'Observatoire — Mélandria</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<canvas id="starfield"></canvas>
<div class="page">

  <header class="masthead">
    <h1>L'Observatoire</h1>
    <p class="subtitle">Recueil d'illustrations de campagnes</p>
  </header>

  <div class="campaign-bar" id="campaignBar">
    <!-- onglets de campagne injectés dynamiquement -->
  </div>

  <div class="filter-bar" id="filterBar">
    <span class="filter-label">Filtrer</span>
    <!-- tags injectés dynamiquement -->
  </div>

  <main class="gallery">
    <div class="grid" id="grid"></div>
    <div class="empty-state" id="emptyState" style="display:none;">
      <div class="glyph">✦</div>
      <p>Aucune illustration ne correspond à ce filtre pour l'instant.</p>
    </div>
  </main>

  <footer class="foot">
    <a class="admin-link" href="admin.html">Accès conservateur</a>
  </footer>
</div>

<div class="lightbox" id="lightbox">
  <button class="lightbox-close" id="lightboxClose">Fermer ✕</button>
  <div class="lightbox-inner">
    <img id="lightboxImg" src="" alt="" />
    <div class="lightbox-caption" id="lightboxCaption"></div>
  </div>
</div>

<script src="js/starfield.js"></script>
<script src="js/gallery.js"></script>
</body>
</html>
